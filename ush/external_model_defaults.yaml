FV3GFS:
  task_make_ics:
    chgres_cube:
      namelist:
        update_values:
          config:
            atm_files_input_grid: "{{ 'fn_atm' | env }}"
            sfc_files_input_grid: "{{ 'fn_sfc' | env }}"
            tracers_input: ["spfh","clwmr","o3mr","icmr","rwmr","snmr","grle"]
            tracers: ["sphum","liq_wat","o3mr","ice_wat","rainwat","snowwat","graupel"]
  task_make_lbcs:
    chgres_cube:
      namelist:
        update_values:
          config:
            atm_files_input_grid: "{{ 'fn_atm' | env }}"
            tracers_input: ["spfh","clwmr","o3mr","icmr","rwmr","snmr","grle"]
            tracers: ["sphum","liq_wat","o3mr","ice_wat","rainwat","snowwat","graupel"]

